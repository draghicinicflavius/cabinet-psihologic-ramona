<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramona Moraru | Psiholog</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <nav class="navbar">
            <div class="logo">
                <a href="#acasa">
                    <!-- Pune imaginea ta aici -->
                    <img src="images/logo1.jpeg" alt="Logo Ramona Moraru" class="site-logo">
                </a>
            </div>
            
            <!-- Butonul Hamburger Nou -->
            <button class="hamburger" aria-label="Deschide meniul">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <ul class="nav-links">
                <li><a href="#acasa">Acasă</a></li>
                <li><a href="#despre">Despre mine</a></li>
                <li><a href="#servicii">Servicii</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="acasa" class="hero-section">
            <div class="hero-content">
                <h1>Bine ai venit!</h1>
                <p class="hero-intro">Sunt Ramona Moraru și te pot ajuta cu:</p>
                <!-- Aici se va întâmpla magia cu textul care se schimbă -->
                <div class="animated-text-container">
                    <span id="typewriter-text" class="typewriter"></span><span class="cursor">|</span>
                </div>
                <a href="#contact" class="btn-primary">Programează o ședință</a>
            </div>
            
            <div class="hero-image-container">
                <!-- Înlocuiește cu poza ei reală -->
                <img src="images/ramona-profil.jpeg" alt="Portret Ramona Moraru" class="profile-circle">
            </div>
        </section>
    </main>

    <!-- Footer adăugat scurt pentru structură -->
    <footer class="site-footer">
        <div class="developer-credit">
            <p><small>Dezvoltat de FLAtech - by Flavius Draghici</small></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
